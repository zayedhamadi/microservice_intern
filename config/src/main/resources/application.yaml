server:
  port: ${CONFIG_PORT:8888}

spring:
  application:
    name: config-server
  cloud:
    config:
      enabled: false
      server:
        git:
          uri: https://github.com/zayedhamadi/microservice_intern
          default-label: main
          search-paths: config-repo

eureka:
  client:
    service-url:
      defaultZone: http://localhost:${DISCOVERY_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

logging:
  level:
    org.springframework.cloud.config: INFO