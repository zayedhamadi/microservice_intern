
server:
  port: ${RECRUTEMENT_PORT:8082}

  shutdown: graceful

  tomcat:
    max-http-form-post-size: ${MAX_HTTP_FORM_POST_SIZE:25MB}

    threads:
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:10}

  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never



google:
  calendar:

    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}

    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}

    refresh-token: ${GOOGLE_CALENDAR_REFRESH_TOKEN:}

    calendar-id: ${GOOGLE_CALENDAR_ID:primary}




ranking-service:
  url: ${RANKING_SERVICE_URL:http://ranking-service:8002}



internal:
  api:
    key: ${INTERNAL_API_KEY}




spring:


  application:
    name: recrutement-service


  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}



  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}



  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}


  data:
    mongodb:

      uri: ${MONGO_URI}

      auto-index-creation: ${MONGO_AUTO_INDEX_CREATION:false}

      uuid-representation: standard


  mail:

    host: ${EMAIL_HOST}

    port: ${EMAIL_PORT:587}

    username: ${EMAIL_USER}

    password: ${EMAIL_PASSWORD}

    properties:
      mail:
        debug: ${EMAIL_DEBUG:false}

        smtp:

          auth: true

          starttls:
            enable: true
            required: true



  security:
    oauth2:
      resourceserver:
        jwt:

          # Validates the token issuer
          issuer-uri: ${KEYCLOAK_ISSUER_URI}



  servlet:
    multipart:

      max-file-size: ${MAX_FILE_SIZE:10MB}

      max-request-size: ${MAX_REQUEST_SIZE:25MB}


  mvc:
    async:
      request-timeout: ${REQUEST_TIMEOUT:30s}



eureka:

  client:

    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka/}

    register-with-eureka: true

    fetch-registry: true

    registry-fetch-interval-seconds: ${EUREKA_FETCH_INTERVAL:30}

    initial-instance-info-replication-interval-seconds: ${EUREKA_INITIAL_REPLICATION:40}


  instance:


    prefer-ip-address: true

    instance-id: ${spring.application.name}:${server.port}:${random.value}

    lease-renewal-interval-in-seconds: ${EUREKA_RENEWAL_INTERVAL:30}

    lease-expiration-duration-in-seconds: ${EUREKA_EXPIRATION:90}




user-service:
  url: ${USER_SERVICE_URL:http://user-service:8081}




app:
  frontend:
    url: ${FRONTEND_URL:http://frontend:4200}


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_ENABLED:true}



logging:
  level:
    root: ${LOG_LEVEL:INFO}



    org.springframework.data.mongodb.core: ${MONGO_LOG_LEVEL:INFO}

    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}

    org.springframework.cloud.config: ${CONFIG_LOG_LEVEL:INFO}
    org.springframework.web.socket: WARN

    org.springframework.web.socket.messaging: WARN

    org.springframework.web.socket.sockjs: WARN

    org.springframework.messaging: WARN

    org.springframework.messaging.simp: WARN

    org.springframework.web.socket.config.WebSocketMessageBrokerStats: WARN

    org.apache.tomcat: INFO

    reactor.netty: WARN