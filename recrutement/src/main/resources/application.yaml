server:
  port: ${RECRUTEMENT_PORT:8082}
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 25MB

google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    refresh-token: ${GOOGLE_CALENDAR_REFRESH_TOKEN:}
    calendar-id: ${GOOGLE_CALENDAR_ID:primary}

ranking-service:
  url: ${RANKING_SERVICE_URL:http://localhost:8002}

internal:
  api:
    key: ${INTERNAL_API_KEY}

spring:
  application:
    name: recrutement-service

  config:
    import: optional:configserver:http://localhost:${CONFIG_PORT:8888}

  lifecycle:
    timeout-per-shutdown-phase: 20s

  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true

  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USER}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:${DISCOVERY_PORT:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.data.mongodb.core: DEBUG
    org.springframework.security: INFO

user-service:
  url: ${USER_SERVICE_URL}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}