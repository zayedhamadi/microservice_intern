<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau poste disponible</title>
</head>
<body style="font-family:Arial,sans-serif;line-height:1.6;color:#333;max-width:600px;margin:0 auto;padding:20px;background:#f5f5f5">
<div style="background:#007BFF;color:white;padding:15px;text-align:center;border-radius:8px 8px 0 0"><h1
        style="margin:0;font-size:22px">Nouveau poste disponible !</h1></div>
<div style="padding:25px;background:white;border-radius:0 0 8px 8px">
    <p>Bonjour <strong>{{prenom}}</strong>,</p>
    <p>Un nouveau poste vient d'être publié et pourrait vous intéresser :</p>
    <p style="font-size:20px;font-weight:bold;color:#007BFF">{{titre}}</p>
    <table style="width:100%;border-collapse:collapse;margin:15px 0">
        <tr>
            <td style="color:#777;width:160px">Lieu :</td>
            <td>{{lieu}}</td>
        </tr>
        <tr>
            <td style="color:#777">Type de contrat :</td>
            <td>{{typeContrat}}</td>
        </tr>
    </table>
    <div style="margin-top:15px;padding:12px;background:#f9f9f9;border-left:3px solid #007BFF;border-radius:3px">
        {{description}}
    </div>
    <p style="text-align:center;margin:25px 0"><a href="{{consulterUrl}}"
                                                  style="display:inline-block;padding:12px 24px;background:#007BFF;color:white;text-decoration:none;border-radius:6px;font-weight:600">Consulter
        l'offre</a></p>
</div>
<div style="margin-top:20px;text-align:center;color:#777;font-size:12px"><p>© {{anneeCourante}} - Supra Technology. Tous
    droits réservés.</p></div>
</body>
</html>
