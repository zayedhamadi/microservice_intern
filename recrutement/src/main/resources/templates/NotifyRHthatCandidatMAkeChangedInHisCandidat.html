<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle candidature reçue</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #17181c; color: white; padding: 10px; text-align: center; border-radius: 5px; }
        .content { padding: 20px; background-color: #f9f9f9; border-radius: 5px; margin-top: 20px; }
        .poste-title { font-size: 18px; font-weight: bold; color: #17181c; margin: 0 0 10px 0; }
        .candidat-card { background-color: #ffffff; border-left: 3px solid #7c5cff; border-radius: 3px; padding: 12px 16px; margin: 15px 0; }
        .candidat-name { font-weight: bold; font-size: 16px; margin: 0 0 4px 0; }
        .candidat-email { color: #777; font-size: 14px; }
        .button { display: inline-block; padding: 10px 20px; background-color: #7c5cff; color: white; text-decoration: none; border-radius: 5px; margin-top: 20px; }
        .footer { margin-top: 20px; text-align: center; color: #777; font-size: 12px; }
    </style>
</head>
<body>
<div class="header">
    <h1>Nouvelle candidature</h1>
</div>
<div class="content">
    <p>Une nouvelle candidature vient d'être déposée pour le poste :</p>
    <p class="poste-title">{{titrePoste}}</p>

    <div class="candidat-card">
        <p class="candidat-name">{{nomCandidat}}</p>
        <p class="candidat-email">{{emailCandidat}}</p>
    </div>

    <p>Consultez le profil complet et le CV du candidat :</p>
    <a href="{{consulterUrl}}" class="button">Voir la candidature</a>
</div>
<div class="footer">
    <p>© 2026 - Votre Entreprise</p>
</div>
</body>
</html>
