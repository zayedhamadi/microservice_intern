<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle candidature</title></head>
<body style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:20px">
<div style="background:#17181c;color:white;padding:10px;text-align:center;border-radius:5px"><h1
        style="margin:0;font-size:20px">Nouvelle candidature</h1></div>
<div style="padding:20px;background:#f9f9f9;border-radius:5px;margin-top:20px">
    <p>Une nouvelle candidature vient d'être déposée pour le poste :</p>
    <p style="font-size:18px;font-weight:bold">{{titrePoste}}</p>
    <div style="background:white;border-left:3px solid #7c5cff;padding:12px 16px;margin:15px 0"><p
            style="font-weight:bold;margin:0">{{nomCandidat}}</p>
        <p style="color:#777;font-size:14px;margin:0">{{emailCandidat}}</p></div>
    <a href="{{consulterUrl}}"
       style="display:inline-block;padding:10px 20px;background:#7c5cff;color:white;text-decoration:none;border-radius:5px">Voir
        la candidature</a>
</div>
<div style="text-align:center;color:#777;font-size:12px;margin-top:20px">© {{anneeCourante}} - Supra Technology</div>
</body>
</html>
