<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Profil sélectionné</title></head>
<body style="font-family:'Segoe UI',Arial,sans-serif;max-width:600px;margin:0 auto;padding:20px;background:#f5f5f5">
<div style="background:#1a5fb0;color:white;padding:20px;text-align:center;border-radius:8px 8px 0 0"><h1 style="margin:0;font-size:22px">Votre profil a retenu notre attention !</h1></div>
<div style="padding:25px;background:white;border-radius:0 0 8px 8px">
<p>Bonjour <strong>{{prenom}}</strong>,</p>
<p>Votre candidature pour le poste <strong>{{titrePoste}}</strong> évolue :</p>
<div style="display:inline-block;background:#eaf2ff;color:#1a5fb0;padding:8px 16px;border-radius:20px;font-weight:600">✅ Profil sélectionné</div>
<div class="comment-box" style="display: {{commentaireDisplay}};margin:20px 0;padding:15px;background:#f9f9f9;border-left:4px solid #1a5fb0;border-radius:0 6px 6px 0"><strong>Message du recruteur :</strong><br>{{commentaireRH}}</div>
<div style="text-align:center"><a href="{{consulterUrl}}" style="display:inline-block;padding:12px 24px;background:#1a5fb0;color:white;text-decoration:none;border-radius:6px">Suivre ma candidature</a></div>
</div>
<div style="text-align:center;color:#777;font-size:12px;margin-top:20px">© {{anneeCourante}} - Supra Technology</div>
</body>
</html>
