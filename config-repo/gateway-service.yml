server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:http://localhost:${CONFIG_PORT:8888}
  cloud:
    gateway:
      server:
        webmvc:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/employees/**
            - id: user-service-auth
              uri: lb://USER-SERVICE
              predicates:
                - Path=/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:${DISCOVERY_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,refresh
  endpoint:
    health:
      show-details: always
    refresh:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG