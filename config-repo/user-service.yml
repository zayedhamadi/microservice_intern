server:
  port: ${EMPLOYEE_PORT:8081}
  shutdown: graceful

  tomcat:
    max-http-form-post-size: 20971520

spring:
  application:
    name: user-service

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_MAX_LIFETIME:1200000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD:30000}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect

        jdbc:
          batch_size: 20

        order_inserts: true
        order_updates: true

  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USER}
    password: ${EMAIL_PASSWORD}

    properties:
      mail:
        debug: ${EMAIL_DEBUG:false}

        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:200MB}

  mvc:
    async:
      request-timeout: ${REQUEST_TIMEOUT:30000}

keycloak:
  server-url: ${KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${CLIENT_SECRET_KEYCLOAK}
  admin-username: ${KEYCLOAK_ADMIN_USER}
  admin-password: ${KEYCLOAK_ADMIN_PWD}

internal:
  api:
    key: ${INTERNAL_API_KEY}

app:
  bootstrap:
    employee:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      email: ${EMAIL_ADMIN}
      password: ${BOOTSTRAP_ADMIN_PASSWORD}
      nom: ${NOM_ADMIN:Admin}
      prenom: ${PRENOM_ADMIN:Systeme}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka/}

    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: ${EUREKA_FETCH_INTERVAL:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:INFO}
    org.hibernate.orm.jdbc.bind: ${HIBERNATE_BIND_LOG_LEVEL:WARN}
    org.hibernate.orm.jdbc.extract: ${HIBERNATE_EXTRACT_LOG_LEVEL:WARN}
    org.springframework.data.jpa.repository.query: ${JPA_QUERY_LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    org.apache.catalina: ${CATALINA_LOG_LEVEL:WARN}
    org.apache.coyote: ${COYOTE_LOG_LEVEL:WARN}
    org.springframework.boot: ${SPRING_BOOT_LOG_LEVEL:WARN}
