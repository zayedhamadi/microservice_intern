server:
  port: ${RECRUTEMENT_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: recrutement-service

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

  data:
    mongodb:
      uri: ${MONGO_URI}

  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USER}
    password: ${EMAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:200MB}

google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET}
    refresh-token: ${GOOGLE_CALENDAR_REFRESH_TOKEN}
    calendar-id: ${GOOGLE_CALENDAR_ID:primary}

ranking-service:
  url: ${RANKING_SERVICE_URL:http://ranking-service:8002}

user-service:
  url: ${USER_SERVICE_URL:http://user-service:8081}

internal:
  api:
    key: ${INTERNAL_API_KEY}

keycloak:
  server-url: ${KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${CLIENT_SECRET_KEYCLOAK}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka/}

    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: ${EUREKA_FETCH_INTERVAL:30}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    org.springframework.data.mongodb: ${MONGODB_LOG_LEVEL:INFO}
