# ============================================================
# DISCOVERY SERVICE - EUREKA SERVER
# ============================================================

server:
  port: ${DISCOVERY_PORT:8761}
  shutdown: graceful

spring:
  application:
    name: discovery-service

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}




eureka:
  client:
    # Eureka Server ne s'enregistre pas lui-même
    register-with-eureka: false

    fetch-registry: false

  server:

    enable-self-preservation: false

    eviction-interval-timer-in-ms: ${EUREKA_EVICTION_INTERVAL:10000}

    wait-time-in-ms-when-sync-empty: ${EUREKA_WAIT_TIME:5000}




management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never

  health:
    defaults:
      enabled: true

  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_ENABLED:true}




logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.netflix.eureka: ${EUREKA_LOG_LEVEL:INFO}
    com.netflix.discovery: ${EUREKA_DISCOVERY_LOG_LEVEL:INFO}
    org.springframework.cloud.netflix.eureka: ${EUREKA_SPRING_LOG_LEVEL:INFO}