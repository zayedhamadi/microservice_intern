
server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful

  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: gateway-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:15MB}
      max-request-size: ${MAX_REQUEST_SIZE:30MB}

  cloud:
    gateway:
      httpclient:
        max-header-size: ${GATEWAY_MAX_HEADER_SIZE:16KB}

      server:
        webmvc:
          routes:
            - id: user-service-auth
              uri: lb://USER-SERVICE
              predicates:
                - Path=/auth/**

            - id: recrutement-service-cv
              uri: lb://RECRUTEMENT-SERVICE
              predicates:
                - Path=/cv/**

            - id: user-service-users
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**,/cessation/**

            - id: user-service-employees
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/employees/**

            - id: user-service-api-users
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: recrutement-service-certifications
              uri: lb://RECRUTEMENT-SERVICE
              predicates:
                - Path=/certifications/**

            - id: user-service-api-admin
              uri: lb://USER-SERVICE
              predicates:
                - Path=/EmployeeManagementController/**

            - id: user-service-ws-admin
              uri: lb://USER-SERVICE
              predicates:
                - Path=/ws-admin/**

            - id: user-service-departements
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/departements/**

            - id: recrutement-service-postes
              uri: lb://RECRUTEMENT-SERVICE
              predicates:
                - Path=/rh/api/postesRecrutement/**

            - id: recrutement-service-candidatures
              uri: lb://RECRUTEMENT-SERVICE
              predicates:
                - Path=/rh/api/candidatures/**

            - id: recrutement-service-candidat
              uri: lb://RECRUTEMENT-SERVICE
              predicates:
                - Path=/candidat/**
            - id: recrutement-service-interviews
              uri: lb://RECRUTEMENT-SERVICE
              predicates:
                - Path=/interviews/**
            - id: recrutement-service-entretiens-cal
              uri: lb://RECRUTEMENT-SERVICE
              predicates:
                - Path=/rh/api/entretiens/**
            - id: recrutement-service-entretiens-candidatt
              uri: lb://RECRUTEMENT-SERVICE
              predicates:
                - Path=/candidat/api/entretiens/**
            - id: recrutement-service-entretiens-candidatt-report
              uri: lb://RECRUTEMENT-SERVICE
              predicates:
                - Path=/rh/api/entretiens/**
            - id: user-service-rh-
              uri: lb://USER-SERVICE
              predicates:
                - Path=/rh/**
            - id: recrutement-service-stats-dashboard-rh
              uri: lb://RECRUTEMENT-SERVICE
              predicates:
                - Path=/api/recrutement/stats/**
            - id: ws-recrutement
              uri: lb:ws://recrutement-service
              predicates:
                - Path=/ws-recrutement/**
            - id: recrutement-service-dashboard-candidat
              uri: lb://RECRUTEMENT-SERVICE
              predicates:
                - Path=/api/recrutement/candidat/dashboard/**
    loadbalancer:
        cache:
          ttl: ${LOADBALANCER_CACHE_TTL:5s}

        retry:
          enabled: ${LOADBALANCER_RETRY_ENABLED:true}
          max-retries-on-same-service-instance: ${LOADBALANCER_RETRY_SAME_INSTANCE:1}
          max-retries-on-next-service-instance: ${LOADBALANCER_RETRY_NEXT_INSTANCE:1}
          retry-on-all-operations: false

# ============================================================
# EUREKA
# ============================================================

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka/}

    register-with-eureka: true
    fetch-registry: true

    registry-fetch-interval-seconds: ${EUREKA_FETCH_INTERVAL:30}

# ============================================================
# ACTUATOR / OBSERVABILITY
# ============================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_ENABLED:true}

# ============================================================
# APPLICATION INFORMATION
# ============================================================

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:unknown}
    environment: ${SPRING_PROFILES_ACTIVE:prod}

# ============================================================
# LOGGING
# ============================================================

logging:
  level:
    root: ${LOG_LEVEL:INFO}

    org.springframework.cloud.gateway:
      ${GATEWAY_LOG_LEVEL:INFO}

    org.springframework.cloud.loadbalancer:
      ${LOADBALANCER_LOG_LEVEL:INFO}

    org.springframework.cloud.netflix.eureka:
      ${EUREKA_LOG_LEVEL:INFO}

    org.springframework.web:
      ${WEB_LOG_LEVEL:INFO}

