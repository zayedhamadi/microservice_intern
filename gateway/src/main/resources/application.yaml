server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:http://localhost:${CONFIG_PORT:8888}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service-auth
              uri: lb://USER-SERVICE
              predicates:
                - Path=/auth/**
            - id: user-service-users
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**
            - id: user-service-employees
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/employees/**
            - id: user-service-api-users
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
            - id: user-service-api-certifications
              uri: lb://USER-SERVICE
              predicates:
                - Path=/certifications/**
    loadbalancer:
      cache:
        ttl: 5s          
      retry:
        enabled: true
        max-retries-on-same-service-instance: 1
        max-retries-on-next-service-instance: 2
        retry-on-all-operations: true

  instance:
    prefer-ip-address: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:${DISCOVERY_PORT:8761}/eureka/
    registry-fetch-interval-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway