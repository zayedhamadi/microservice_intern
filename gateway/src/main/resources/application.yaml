server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:http://localhost:${CONFIG_PORT:8888}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/employees/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:${DISCOVERY_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway