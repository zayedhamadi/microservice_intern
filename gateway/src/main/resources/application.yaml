server:
  port: ${GATEWAY_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/stage}

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:http://localhost:${CONFIG_PORT:8888}${CONTEXT_PATH:/stage}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:${DISCOVERY_PORT:8761}${CONTEXT_PATH:/stage}/eureka/
  instance:
    prefer-ip-address: true