networks:
  stage-network:
    driver: bridge
    name: stage-network

volumes:
  mysql-data:
  mongo_data:
    external: true
    name: mongo_micro_volume        # réutilise le volume déjà créé manuellement
  jenkins_home:
    external: true
  keycloak-data:
    external: true
    name: keycloak_microservice_stage
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:

# ---------------------------------------------------------------------------
# Ancres réutilisables : évite de répéter la même config de logging partout
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:

  mysql:
    image: mysql:8.0
    container_name: stage_mysql
    restart: unless-stopped
    <<: *default-security
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: employee_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - stage-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: stage_keycloak
    restart: unless-stopped
    <<: *default-security
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PWD}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak_db?createDatabaseIfNotExist=true
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak-import:/opt/keycloak/data/import:ro
    networks:
      - stage-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10

  mongo-recrutement:
    image: mongo:7
    container_name: mongo-recrutement
    restart: unless-stopped
    <<: *default-security
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: recrutement_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - stage-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  config-server:
    build:
      context: ./config
      dockerfile: Dockerfile
    container_name: stage_config
    restart: unless-stopped
    <<: *default-security
    read_only: true
    tmpfs:
      - /tmp
    env_file: .env
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    ports:
      - "${CONFIG_PORT}:8888"
    networks:
      - stage-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  discovery:
    build:
      context: ./discovery
      dockerfile: Dockerfile
    container_name: stage_discovery
    restart: unless-stopped
    <<: *default-security
    read_only: true
    tmpfs:
      - /tmp
    env_file: .env
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/
    ports:
      - "${DISCOVERY_PORT}:8761"
    networks:
      - stage-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: stage_gateway
    restart: unless-stopped
    <<: *default-security
    read_only: true
    tmpfs:
      - /tmp
    env_file: .env
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    ports:
      - "${GATEWAY_PORT}:8080"
    networks:
      - stage-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
    depends_on:
      discovery:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service:
    build:
      context: ./user
      dockerfile: Dockerfile
    container_name: stage_user
    restart: unless-stopped
    <<: *default-security
    read_only: true
    tmpfs:
      - /tmp
    env_file: .env
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      DB_URL: jdbc:mysql://mysql:3306/employee_db?createDatabaseIfNotExist=true
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM}
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "${EMPLOYEE_PORT}:8081"
    networks:
      - stage-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
    depends_on:
      mysql:
        condition: service_healthy
      discovery:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  recrutement-service:
    build:
      context: ./recrutement
      dockerfile: Dockerfile
    container_name: stage_recrutement
    restart: unless-stopped
    <<: *default-security
    read_only: true
    tmpfs:
      - /tmp
    env_file: .env
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-recrutement:27017/recrutement_db?authSource=admin
      KEYCLOAK_URL: http://keycloak:8080
      USER_SERVICE_URL: http://user-service:8081
    ports:
      - "${RECRUTEMENT_PORT}:8082"
    networks:
      - stage-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
    depends_on:
      mongo-recrutement:
        condition: service_healthy
      discovery:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ../stage_front/frontend-microservice
      dockerfile: Dockerfile
    container_name: stage_frontend
    restart: unless-stopped
    <<: *default-security
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    ports:
      - "4200:8080"
    networks:
      - stage-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak-backup:
    build:
      context: ./keycloak-backup
      dockerfile: Dockerfile
    container_name: stage_keycloak_backup
    profiles: ["tools"]
    <<: *default-security
    volumes:
      - keycloak-data:/data:ro
      - C:/keycloak_microservice_backup:/backup
    networks:
      - stage-network
    logging: *default-logging

  jenkins:
    image: jenkins-with-docker:latest
    container_name: stage_jenkins
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - stage-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"

  sonarqube-db:
    image: postgres:15-alpine
    container_name: stage_sonar_db
    restart: unless-stopped
    profiles: ["tools"]
    <<: *default-security
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks:
      - stage-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  sonarqube:
    image: sonarqube:community
    container_name: stage_sonarqube
    restart: unless-stopped
    profiles: ["tools"]
    <<: *default-security
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    networks:
      - stage-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
    depends_on:
      sonarqube-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s